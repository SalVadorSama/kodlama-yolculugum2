<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLingo - Yazılım Kampı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="stats-header">
            <div class="stat-item">🔥 <span id="streak-val">0</span> Gün</div>
            <div class="stat-item">⭐ Lvl <span id="lvl-val">1</span></div>
            <div class="stat-item">❄️ <span id="freeze-val">0</span></div>
        </header>

        <div class="progress-wrapper">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <main id="content-area">
            <!-- Ders Seçim Ekranı -->
            <div id="home-screen">
                <h2 id="day-title">Öğrenmeye Hazır Mısın?</h2>
                <div id="lesson-list"></div>
            </div>

            <!-- Öğretme Ekranı -->
            <div id="teaching-screen" class="hidden">
                <h2 id="teach-title">Konu Başlığı</h2>
                <div id="teach-content" class="content-box"></div>
                <button onclick="goToQuiz()">Anladım, Test Et!</button>
            </div>

            <!-- Soru/Yazma Ekranı -->
            <div id="quiz-screen" class="hidden">
                <h3 id="question-text">Soru?</h3>
                <div id="quiz-input-area"></div>
                <div id="feedback" class="hidden"></div>
                <button id="check-btn" onclick="checkAnswer()">Kontrol Et</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
